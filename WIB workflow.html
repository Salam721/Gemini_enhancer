<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WIB — Build &amp; Review Loop</title>
<style>
  body {
    margin: 0; padding: 24px; background: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .toolbar { display: flex; gap: 10px; }
  button {
    background: #0f172a; color: #fff; border: 0; padding: 9px 16px;
    border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #1e293b; }
  svg {
    max-width: 1100px; width: 100%; height: auto;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .10); border-radius: 10px;
  }
  .hand { font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive; }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="downloadPNG()">Download High-Res PNG</button>
    <button onclick="downloadSVG()">Download SVG</button>
  </div>

  <svg id="loopSvg" viewBox="0 0 1100 1220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
        <circle cx="9" cy="9" r="1.15" fill="#cbd5e1" />
      </pattern>
      <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,1 L9,5 L0,9 z" fill="#0f172a"/>
      </marker>
      <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,1 L9,5 L0,9 z" fill="#c2410c"/>
      </marker>
      <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,1 L9,5 L0,9 z" fill="#0f766e"/>
      </marker>
    </defs>

    <!-- Dotted Background -->
    <rect width="1100" height="1220" fill="#ffffff"/>
    <rect width="1100" height="1220" fill="url(#dots)"/>

    <!-- Header -->
    <text x="115" y="62" font-size="31" font-weight="800" fill="#0f172a">WIB — Build &amp; Review Loop</text>
    <text x="115" y="88" font-size="14" fill="#64748b">How each code change moves between the Human Lead, Parallel Builders, Live Sandbox &amp; Checker</text>

    <rect x="720" y="34" width="265" height="42" rx="21" fill="#fef08a" stroke="#0f172a" stroke-width="2.2"/>
    <text x="852" y="61" class="hand" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">assign  →  build  →  check</text>

    <!-- Step 1: Lead assigns -->
    <path d="M272,120 Q550,116 828,120 Q833,176 828,232 Q550,236 272,232 Q267,176 272,120 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.3"/>
    <circle cx="304" cy="148" r="15" fill="#0f172a"/>
    <text x="304" y="153" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="330" y="152" font-size="17" font-weight="700" fill="#0f172a">Lead assigns a task</text>
    <text x="330" y="170" font-size="12.5" fill="#64748b">[Human Lead + WIB Server · SI-10 Gate · Repo Owner]</text>
    <text x="292" y="196" font-size="13.5" fill="#1e293b">• Done test: compiles, passes tests, &lt;5% drift, 0 traps, 0 MAL-* deps</text>
    <text x="292" y="218" font-size="13.5" fill="#1e293b">• Assigned to: PR Builder + Gemini 4 Hydrogen (Security) &amp; Argon (Invariants)</text>

    <line x1="550" y1="234" x2="550" y2="264" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>

    <!-- Step 2: Builder does the work -->
    <path d="M272,270 Q550,266 828,270 Q833,326 828,382 Q550,386 272,382 Q267,326 272,270 Z" fill="#ffffff" stroke="#0f766e" stroke-width="2.3"/>
    <circle cx="304" cy="298" r="15" fill="#0f766e"/>
    <text x="304" y="303" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="330" y="302" font-size="17" font-weight="700" fill="#0f172a">Builder does the work</text>
    <text x="330" y="320" font-size="12.5" fill="#64748b">[PR Builder / Hydrogen &amp; Argon (Read-Only) · Scope-Locked AC-6]</text>
    <text x="292" y="346" font-size="13.5" fill="#1e293b">• Files allowed: scoped PR module only (never tests, ./datasets, or WIB gates)</text>
    <text x="292" y="368" font-size="13.5" fill="#1e293b">• Prompt: Domain invariants inside &lt;untrusted_pr&gt; + Compile/Run mode</text>

    <line x1="550" y1="384" x2="550" y2="414" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>

    <!-- Step 3: Checker compares -->
    <path d="M272,420 Q550,416 828,420 Q833,512 828,604 Q550,608 272,604 Q267,512 272,420 Z" fill="#ffffff" stroke="#c2410c" stroke-width="2.3"/>
    <circle cx="304" cy="448" r="15" fill="#c2410c"/>
    <text x="304" y="453" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="330" y="452" font-size="17" font-weight="700" fill="#0f172a">Checker compares</text>
    <text x="330" y="470" font-size="12.5" fill="#64748b">[Agent 4: Gemini 4 Carbon + WIB Server Gate SI-15 · Independent]</text>
    <text x="292" y="496" font-size="13.5" font-weight="600" fill="#9a3412">• Ignores the builder's &amp; PR comments' explanations (ASI07 / AML.T0051)</text>

    <text x="305" y="556" class="hand" font-size="14.5" font-weight="700" fill="#c2410c">against</text>
    <circle cx="425" cy="552" r="44" fill="#fff7ed" stroke="#c2410c" stroke-width="2.2"/>
    <text x="425" y="547" font-size="12" font-weight="700" text-anchor="middle" fill="#9a3412">Source 1</text>
    <text x="425" y="564" font-size="11" text-anchor="middle" fill="#7c2d12">Live Sandbox</text>

    <circle cx="548" cy="552" r="44" fill="#fff7ed" stroke="#c2410c" stroke-width="2.2"/>
    <text x="548" y="547" font-size="12" font-weight="700" text-anchor="middle" fill="#9a3412">Source 2</text>
    <text x="548" y="564" font-size="11" text-anchor="middle" fill="#7c2d12">AST+OSS/Neon</text>

    <circle cx="671" cy="552" r="44" fill="#fff7ed" stroke="#c2410c" stroke-width="2.2"/>
    <text x="671" y="547" font-size="12" font-weight="700" text-anchor="middle" fill="#9a3412">Source 3</text>
    <text x="671" y="564" font-size="11" text-anchor="middle" fill="#7c2d12">SHA-256 Gate</text>

    <!-- Connector to Diamond -->
    <line x1="550" y1="606" x2="550" y2="632" stroke="#0f172a" stroke-width="2"/>

    <!-- Pass? Diamond -->
    <polygon points="550,632 616,682 550,732 484,682" fill="#fde68a" stroke="#0f172a" stroke-width="2.4"/>
    <text x="550" y="687" font-size="16" font-weight="800" text-anchor="middle" fill="#0f172a">Pass?</text>

    <!-- NO Branch -->
    <path d="M484,682 L305,682 L305,754" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrOrange)"/>
    <rect x="368" y="668" width="54" height="26" rx="13" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="395" y="686" font-size="12" font-weight="700" text-anchor="middle" fill="#c2410c">NO</text>

    <!-- YES Branch -->
    <path d="M616,682 L795,682 L795,754" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrTeal)"/>
    <rect x="675" y="668" width="58" height="26" rx="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="704" y="686" font-size="12" font-weight="700" text-anchor="middle" fill="#0f766e">YES</text>

    <!-- 4a: Send it back -->
    <path d="M139,760 Q305,756 471,760 Q475,826 471,892 Q305,896 139,892 Q135,826 139,760 Z" fill="#ffffff" stroke="#c2410c" stroke-width="2.3"/>
    <circle cx="168" cy="788" r="15" fill="#c2410c"/>
    <text x="168" y="793" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4a</text>
    <text x="194" y="792" font-size="16.5" font-weight="700" fill="#0f172a">Send it back</text>
    <text x="194" y="810" font-size="12" fill="#64748b">[to the same PR builder]</text>
    <text x="155" y="838" font-size="12.5" fill="#1e293b">• Server verdict + live MP4/subtitles word for word</text>
    <text x="155" y="860" font-size="12.5" fill="#1e293b">• Try count: 1 of 3 (with native-language alert)</text>

    <!-- 5: Lead merges and logs -->
    <path d="M629,760 Q795,756 961,760 Q965,826 961,892 Q795,896 629,892 Q625,826 629,760 Z" fill="#ffffff" stroke="#0f766e" stroke-width="2.3"/>
    <circle cx="658" cy="788" r="15" fill="#0f766e"/>
    <text x="658" y="793" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="684" y="792" font-size="16.5" font-weight="700" fill="#0f172a">Lead merges and logs</text>
    <text x="684" y="810" font-size="12" fill="#64748b">[Human Lead · Owner signs off via Evidence Drawer]</text>
    <text x="645" y="838" font-size="12.5" fill="#1e293b">• Saved: diff, SHA-256 report, 32k–4K MP4, .vtt</text>
    <text x="645" y="860" font-size="12.5" fill="#1e293b">• Audit Bundle (.zip) + PLAN.md updated (SI-7)</text>

    <!-- Loopback 4a -> 2 -->
    <path d="M135,826 L88,826 L88,326 L266,326" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrOrange)"/>
    <text x="104" y="545" class="hand" font-size="14" font-weight="700" fill="#c2410c">fix and</text>
    <text x="104" y="564" class="hand" font-size="14" font-weight="700" fill="#c2410c">resubmit</text>

    <!-- Next task 5 -> 1 -->
    <path d="M965,826 L1012,826 L1012,176 L834,176" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrTeal)"/>
    <text x="935" y="215" class="hand" font-size="14" font-weight="700" fill="#0f766e">next task</text>

    <!-- Bottom 3 Guardrail Cards -->
    <path d="M119,954 Q251,950 383,954 Q387,1063 383,1172 Q251,1176 119,1172 Q115,1063 119,954 Z" fill="#ffffff" stroke="#c2410c" stroke-width="2.1"/>
    <text x="137" y="992" class="hand" font-size="21" font-weight="700" fill="#c2410c">Loop limit</text>
    <text x="137" y="1026" font-size="13.5" font-weight="600" fill="#0f172a">3 tries, then a human decides</text>
    <text x="137" y="1058" font-size="12.5" fill="#475569">Stops AI from looping endlessly</text>
    <text x="137" y="1077" font-size="12.5" fill="#475569">or gaming unit tests while hiding</text>
    <text x="137" y="1096" font-size="12.5" fill="#475569">real behavioral drift (ASI08).</text>

    <path d="M418,954 Q550,950 682,954 Q686,1063 682,1172 Q550,1176 418,1172 Q414,1063 418,954 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.1"/>
    <text x="436" y="992" class="hand" font-size="21" font-weight="700" fill="#0f172a">Time limit</text>
    <text x="436" y="1026" font-size="13.5" font-weight="600" fill="#0f172a">Stop any agent after 15 min</text>
    <text x="436" y="1058" font-size="12.5" fill="#475569">Hard 900s agent timeout and</text>
    <text x="436" y="1077" font-size="12.5" fill="#475569">20s container kill cap prevent</text>
    <text x="436" y="1096" font-size="12.5" fill="#475569">hangs &amp; spend spikes (AC-6).</text>

    <path d="M717,954 Q849,950 981,954 Q985,1063 981,1172 Q849,1176 717,1172 Q713,1063 717,954 Z" fill="#ffffff" stroke="#0f766e" stroke-width="2.1"/>
    <text x="735" y="992" class="hand" font-size="21" font-weight="700" fill="#0f766e">Escalate when</text>
    <text x="735" y="1026" font-size="13.5" font-weight="600" fill="#0f172a">Checker &amp; builder disagree twice</text>
    <text x="735" y="1058" font-size="12.5" fill="#475569">Or immediately on any sleeper</text>
    <text x="735" y="1077" font-size="12.5" fill="#475569">or MAL-* trap — hands final call</text>
    <text x="735" y="1096" font-size="12.5" fill="#475569">to human reviewer (ASI01 / ASI09).</text>
  </svg>

<script>
function downloadSVG() {
  const svg = document.getElementById("loopSvg").outerHTML;
  const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wib_build_review_loop.svg";
  a.click();
}
function downloadPNG() {
  const svgEl = document.getElementById("loopSvg");
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 2200; canvas.height = 2440; // Crisp 2x print resolution
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "wib_build_review_loop.png";
    a.click();
  };
  img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
}
</script>
</body>
</html>
